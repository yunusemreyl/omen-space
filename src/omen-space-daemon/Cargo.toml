[package]
name = "omen-space-daemon"
version = "2.1.3"
edition = "2021"

[dependencies]
zbus = { version = "4.3.1", features = ["tokio"] }
tokio = { version = "1.32", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
glob = "0.3"
evdev = { version = "0.12", features = ["tokio"] }
lazy_static = "1.4"
futures = "0.3.34"
nvml-wrapper = "0.13.0"
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }
