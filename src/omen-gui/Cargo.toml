[package]
name = "omen-gui"
version = "2.1.3"
edition = "2021"

[dependencies]
gtk = { version = "0.7", package = "gtk4", features = ["v4_12"] }
libadwaita = { version = "0.5", features = ["v1_4"] }
glib = "0.18"
tokio = { version = "1", features = ["full"] }
zbus = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3.4"
libc = "0.2"
urlencoding = "2.1.3"
omen-types = { version = "0.1.0", path = "../omen-types" }
