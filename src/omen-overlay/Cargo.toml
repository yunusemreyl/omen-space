[package]
name = "omen-overlay"
version = "2.6.0"
edition = "2021"

[dependencies]
gtk = { version = "0.7", package = "gtk4", features = ["v4_12"] }

libadwaita = { version = "0.5", features = ["v1_4"] }
glib = "0.18"
tokio = { version = "1", features = ["full"] }
zbus = "4.4"
serde_json = "1.0"
env_logger = "0.10"
futures = "0.3.34"
omen-types = { version = "2.6.0", path = "../omen-types" }
