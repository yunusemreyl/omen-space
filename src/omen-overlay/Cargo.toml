[package]
name = "omen-overlay"
version = "2.1.2"
edition = "2021"

[dependencies]
gtk = { version = "0.7", package = "gtk4", features = ["v4_12"] }
libadwaita = { version = "0.5", features = ["v1_4"] }
glib = "0.18"
tokio = { version = "1", features = ["full"] }
zbus = "4.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.10"
libc = "0.2"
clap = { version = "4.4", features = ["derive"] }
futures = "0.3.34"
